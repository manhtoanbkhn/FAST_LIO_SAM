laserMapping:
  ros__parameters:
    common:
      lid_topic: "/os_cloud_node/points"
      imu_topic: "/os_cloud_node/imu"
      time_sync_en: false

    preprocess:
      lidar_type: 3
      scan_line: 64
      blind: 4

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 180
      det_range: 150.0
      extrinsic_est_en: true
      extrinsic_T: [0.0, 0.0, 0.0]
      extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
      extrinR_Gnss2Lidar: [1, 0, 0, 0, 1, 0, 0, 0, 1]
      extrinT_Gnss2Lidar: [0.0, 0.0, 0.0]

    publish:
      path_en: false
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true
      interval: -1
